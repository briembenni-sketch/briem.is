<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="briem — vefsíðugerð fyrir íslensk hlaðvörp">
  <defs>
    <radialGradient id="glow" cx="28%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#2F6BFF" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#2F6BFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2F6BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="markbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#1236A6"/>
    </linearGradient>
    <style>
      .d { font-family: "Bricolage Grotesque", "Hanken Grotesk", Arial, sans-serif; font-weight: 800; }
      .m { font-family: "JetBrains Mono", ui-monospace, monospace; letter-spacing: 4px; }
      .b { font-family: "Hanken Grotesk", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#070A14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- mono eyebrow -->
  <text x="80" y="150" class="m" font-size="22" fill="#5B8CFF">VEFSÍÐUGERÐ FYRIR ÍSLENSK HLAÐVÖRP</text>

  <!-- headline -->
  <text class="d" font-size="110" fill="#ECEEF2" letter-spacing="-3">
    <tspan x="78" y="310">Við látum</tspan>
    <tspan x="78" y="420"><tspan fill="#38BDF8">verkið</tspan> tala</tspan>
  </text>

  <!-- logo mark + wordmark bottom-left -->
  <g transform="translate(80 505) scale(0.5)">
    <rect x="25.2" y="7.2" width="21.6" height="105.6" rx="10.8" fill="url(#markbg)"/>
    <circle cx="64.1" cy="76.8" r="31.2" fill="none" stroke="url(#markbg)" stroke-width="21.6"/>
    <circle cx="103.2" cy="21.6" r="10.8" fill="#37D1F2"/>
  </g>
  <text x="152" y="568" class="d" font-size="40" fill="#ECEEF2" letter-spacing="-1">briem</text>

  <!-- attribution bottom-right -->
  <text x="1120" y="568" text-anchor="end" class="b" font-size="26" fill="#9AA3B2">projectbriem.is</text>
</svg>
